services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # OPENAI_API_KEY is still supported as an override from your shell.
      - OpenAI__ApiKey=${OPENAI_API_KEY:-${OpenAI__ApiKey:-}}
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker-compose.yml
    restart: unless-stopped
