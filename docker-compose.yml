services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Set your OpenAI API key via the environment variable OPENAI_API_KEY
      # before running: export OPENAI_API_KEY=sk-...
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
